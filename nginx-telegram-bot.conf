# Nginx конфигурация для проксирования бота
# Поместите этот файл в /etc/nginx/sites-available/telegram-bot
# Затем выполните: sudo ln -s /etc/nginx/sites-available/telegram-bot /etc/nginx/sites-enabled/
# И перезагрузите: sudo systemctl reload nginx

upstream telegram_bot {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name ваш_домен.бегет.ру;  # Замените на ваш домен на Beget

    # Перенаправляем HTTP на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    # Для Let's Encrypt certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name ваш_домен.бегет.ру;  # Замените на ваш домен на Beget

    # SSL сертификаты (используйте Let's Encrypt или сертификат от Beget)
    ssl_certificate /etc/letsencrypt/live/ваш_домен.бегет.ру/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ваш_домен.бегет.ру/privkey.pem;

    # SSL конфигурация
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логи
    access_log /var/log/nginx/telegram-bot.access.log;
    error_log /var/log/nginx/telegram-bot.error.log;

    # Webhook для бота (основной endpoint)
    location /webhook {
        proxy_pass http://telegram_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://telegram_bot;
        proxy_set_header Host $host;
    }

    # Главная страница
    location / {
        proxy_pass http://telegram_bot;
        proxy_set_header Host $host;
    }
}
